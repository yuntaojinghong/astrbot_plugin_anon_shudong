name: astrbot_plugin_anon_relay
display_name: 匿名倾诉转述
short_desc: 私聊/群聊开启匿名模式后，将倾诉内容以随机匿名昵称按自定义格式转述到指定群聊；支持私聊白名单（消息转述，非转发聊天记录）
desc: 用户私聊或群聊中发送「开启匿名模式」建立会话，之后发送的文字/图片会被机器人以随机匿名昵称（如 番茄）按可自定义的格式模板（默认【{name}】：{content}）转述到指定群聊。支持群聊映射（A群→A群）与统一多群转述，支持私聊白名单（白名单内用户可与机器人正常私聊），未开启时私聊保持沉默、群聊不干预。
help: 私聊或群聊发送「开启匿名模式」开始倾诉；发送「关闭匿名模式」或「结束倾诉」结束。转述格式、随机昵称池、群聊映射规则、私聊白名单均可在插件设置面板中调整。
version: 1.3.0
author: guishe
repo: https://github.com/yuntaojinghong/astrbot_plugin_anon_relay
astrbot_version: ">=4.16,<5"
