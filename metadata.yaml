name: astrbot_plugin_anon_relay
display_name: 匿名倾诉转述
short_desc: 白名单外用户私聊自动进入匿名模式，倾诉内容以随机匿名昵称按自定义格式转述到指定群聊；支持群聊模式、敏感词审查、管理员禁言与永久禁用、脏话自动和谐（消息转述，非转发聊天记录）
desc: 白名单外的用户私聊机器人会自动进入匿名模式（也可用关键词开启），之后发送的文字/图片会被机器人以随机匿名昵称（如 番茄）按可自定义的格式模板（默认【{name}】：{content}）转述到指定群聊。私聊转述目标可按用户映射规则指定，也可自动识别倾诉者所在的群（A群的人转述到A群，同时在A、B群则同时转述）。白名单内的用户可自由聊天（需要匿名时发送关键词即可）。支持群聊模式、统一多群转述、敏感词内容审查（命中直接拦截）、管理员禁言/解禁/永久禁用匿名身份、脏话自动和谐。
help: 白名单外用户私聊直接进入匿名模式；白名单用户自由聊天，发送「开启匿名模式」可主动匿名。发送「关闭匿名模式」或「结束倾诉」结束。管理员可发送「禁言 昵称 分钟」「永久禁用 昵称」等命令管理匿名身份。转述格式、随机昵称池、群聊/用户映射、自动识别所在群、私聊白名单、审查词库、和谐词库均可在插件设置面板中调整。
version: 1.6.0
author: guishe
repo: https://github.com/yuntaojinghong/astrbot_plugin_anon_relay
astrbot_version: ">=4.16,<5"
