name: astrbot_plugin_anon_relay
display_name: 匿名倾诉转述
short_desc: 私聊/群聊开启匿名模式后，将倾诉内容以随机匿名昵称按自定义格式转述到指定群聊；支持按用户映射/自动识别所在群、管理员禁言与永久禁用、脏话自动和谐（消息转述，非转发聊天记录）
desc: 用户私聊或群聊中发送「开启匿名模式」建立会话，之后发送的文字/图片会被机器人以随机匿名昵称（如 番茄）按可自定义的格式模板（默认【{name}】：{content}）转述到指定群聊。私聊转述目标可按用户映射规则指定，也可自动识别倾诉者所在的群（A群的人转述到A群，同时在A、B群则同时转述）。支持统一多群转述、私聊白名单、管理员禁言/解禁/永久禁用匿名身份、脏话自动和谐。未开启时私聊保持沉默、群聊不干预。
help: 私聊或群聊发送「开启匿名模式」开始倾诉；发送「关闭匿名模式」或「结束倾诉」结束。管理员可发送「禁言 昵称 分钟」「永久禁用 昵称」等命令管理匿名身份。转述格式、随机昵称池、群聊/用户映射、自动识别所在群、私聊白名单、和谐词库均可在插件设置面板中调整。
version: 1.5.1
author: guishe
repo: https://github.com/yuntaojinghong/astrbot_plugin_anon_relay
astrbot_version: ">=4.16,<5"
