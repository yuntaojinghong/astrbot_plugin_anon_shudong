name: astrbot_plugin_anon_relay
display_name: 匿名树洞
short_desc: 私聊自动进入匿名模式，倾诉内容以随机昵称按自定义格式转述到指定群聊——不是转发聊天记录，群成员看不到任何真实身份
desc: >-
  给机器人开一个「树洞」：白名单外的用户私聊机器人会自动进入匿名模式（也可用关键词主动开启），
  之后发送的文字/图片会被机器人以随机匿名昵称（如「番茄」）按可自定义的格式模板（默认
  【{name}】：{content}）转述到指定群聊。转述目标可按用户映射规则指定，也可自动识别倾诉者所在的群
  （A 群的人转述到 A 群，同时在 A、B 群则同时转述）。白名单内的用户可自由聊天，需要匿名时发送关键词即可。
  支持群聊模式、统一多群转述、敏感词内容审查（命中直接拦截）、管理员禁言/永久禁用匿名身份、脏话自动和谐。
  和谐词库/审查词库/昵称池支持在插件设置页或聊天中直接上传 txt 批量导入，可一键重置。
help: >-
  白名单外用户私聊直接进入匿名模式；白名单用户自由聊天，发送「开启匿名模式」可主动匿名。
  发送「关闭匿名模式」或「结束倾诉」结束。管理员可发送「禁言 昵称 分钟」「永久禁用 昵称」等命令管理匿名身份。
  转述格式、随机昵称池、群聊/用户映射、自动识别所在群、私聊白名单、审查词库、和谐词库均可在插件设置面板中调整。
version: 1.9.1
author: yuntaojinghong
repo: https://github.com/yuntaojinghong/astrbot_plugin_anon_relay
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - wecom
  - weixin_official_account
  - lark
  - dingtalk
  - discord
  - slack
  - kook
  - vocechat
  - satori
  - misskey
  - line
  - matrix
  - mattermost
tags:
  - 匿名
  - 树洞
  - 隐私保护
  - 群聊
  - 匿名转述
